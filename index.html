<!DOCTYPE html>
<html>
<head>
    <title>Avatar Rotator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <img id="rotator" src="" alt="Avatar">
    <script>
        // Make sure these match your exact image file names uploaded to the repository!
        const images = ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg']; 
        
        const randomImage = images[Math.floor(Math.random() * images.length)];
        document.getElementById('rotator').src = randomImage;
    </script>
</body>
</html>
